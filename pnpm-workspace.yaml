# Used only when figure is installed on its own. Inside Myriad, figure is a
# member of frontend/'s workspace and frontend/pnpm-workspace.yaml applies.
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
  - sharp
